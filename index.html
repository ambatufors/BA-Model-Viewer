<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BA Model Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        overflow: hidden;
        font-family: sans-serif;
      }
      canvas {
        display: block;
      }
      #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        padding: 12px;
        border-radius: 8px;
        color: #eee;
        font-size: 12px;
        min-width: 280px;
        max-width: min(360px, calc(100vw - 56px));
        accent-color: #1a8cff;
      }
      #ui.ui-collapsed {
        transform: translateX(calc(-100% - 10px));
      }
      #uiToggle {
        position: absolute;
        top: 14px;
        right: -32px;
        width: 32px;
        height: 36px;
        border: 0;
        border-radius: 0 6px 6px 0;
        background: rgba(0, 0, 0, 0.75);
        color: #7ec8e3;
        cursor: pointer;
        font-size: 18px;
        font-weight: bold;
        line-height: 1;
      }
      #uiToggle:hover {
        background: rgba(20, 20, 20, 0.9);
      }
      #ui h3 {
        margin-bottom: 8px;
        color: #7ec8e3;
      }
      .control {
        margin: 6px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .control label {
        flex: 1;
      }
      .control input[type="range"] {
        width: 100px;
      }
      .control input[type="color"] {
        width: 40px;
        height: 20px;
        border: none;
      }
      .control span.val {
        min-width: 35px;
        text-align: right;
        font-size: 10px;
        color: #aaa;
      }
      /* Timeline */
      #timeline {
        margin: 8px 0;
      }
      #timeline[hidden] {
        display: none;
      }
      .timeline-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #timelinePlay {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 50%;
        background: rgba(26, 140, 255, 0.25);
        color: #cfe7ff;
        cursor: pointer;
        font-size: 12px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #timelinePlay:hover {
        background: rgba(26, 140, 255, 0.5);
      }
      #timelineTrack {
        flex: 1;
        position: relative;
        height: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        touch-action: none;
      }
      #timelineTrack .track-bg {
        position: absolute;
        left: 0;
        right: 0;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.22);
      }
      #timelineTrack .track-fill {
        position: absolute;
        left: 0;
        height: 4px;
        width: 0;
        border-radius: 2px;
        background: #1a8cff;
        pointer-events: none;
      }
      #timelineTrack .track-thumb {
        position: absolute;
        top: 50%;
        left: 0;
        width: 11px;
        height: 11px;
        margin-left: -5.5px;
        border-radius: 50%;
        background: #1a8cff;
        transform: translateY(-50%) scale(0.85);
        transition: transform 80ms ease;
        pointer-events: none;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
      }
      #timelineTrack:hover .track-thumb,
      #timelineTrack.scrubbing .track-thumb {
        transform: translateY(-50%) scale(1.1);
      }
      #timelineTime {
        flex: 0 0 auto;
        font-size: 10px;
        color: #aaa;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        min-width: 74px;
        text-align: right;
      }
      .part-panel {
        margin-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
        padding-top: 8px;
      }
      .part-panel[hidden] {
        display: none;
      }
      .part-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
        color: #7ec8e3;
        font-weight: bold;
      }
      #modelPartsReset {
        border: 0;
        border-radius: 4px;
        padding: 2px 7px;
        background: rgba(126, 200, 227, 0.18);
        color: #d8f4ff;
        cursor: pointer;
        font-size: 11px;
      }
      #modelPartsList {
        max-height: 190px;
        overflow-y: auto;
        padding-right: 8px;
        scrollbar-gutter: stable;
      }
      .part-row {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr) minmax(34px, auto);
        align-items: center;
        gap: 6px;
        min-height: 22px;
        color: #eee;
      }
      .part-row.is-forced .part-name {
        color: #ffe59a;
      }
      .part-row.is-deferred .part-name {
        color: #b9c6cf;
      }
      .part-row.is-loading {
        opacity: 0.65;
      }
      .part-child-row {
        color: #c7d3da;
        font-size: 11px;
      }
      .part-child-row input {
        margin-left: 12px;
      }
      .part-child-row .part-name {
        padding-left: 10px;
      }
      .part-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .part-meta {
        color: #8fa6b2;
        font-size: 10px;
        min-width: 34px;
        padding-right: 2px;
        text-align: right;
      }
      #charSelect:disabled,
      #btnLoadChar:disabled {
        opacity: 0.65;
      }
      #btnLoadChar {
        position: relative;
        min-width: 134px;
        cursor: pointer;
      }
      #btnLoadChar:disabled {
        cursor: not-allowed;
      }
      #btnLoadChar.is-loading {
        cursor: wait;
      }
      #loadStatus {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        min-width: 90px;
        min-height: 44px;
        padding: 10px 16px;
        border: 0;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.58);
        box-shadow: none;
        color: #a8dff2;
        font-size: 12px;
        line-height: 16px;
        pointer-events: none;
      }
      #loadStatus.is-loading,
      #loadStatus:not(:empty) {
        display: flex;
      }
      #loadStatus.is-loading::before {
        content: "\2800\2800\2800\2800";
        display: inline-block;
        width: 76px;
        text-align: center;
        animation: scan 700ms linear infinite;
        color: #fff;
        font: 400 30px/1 "Cascadia Mono", monospace;
        opacity: 0.9;
        vertical-align: -1px;
      }
      #loadStatus.loader-scan::before {
        animation: scan 700ms linear infinite;
      }
      #loadStatus.loader-rain::before {
        animation: rain 1200ms linear infinite;
      }
      #loadStatus.loader-pulse::before {
        animation: pulse 900ms linear infinite;
      }
      #loadStatus.loader-sparkle::before {
        animation: sparkle 900ms linear infinite;
      }
      #loadStatus.loader-cascade::before {
        animation: cascade 840ms linear infinite;
      }
      #loadStatus.loader-waverows::before {
        animation: waverows 1440ms linear infinite;
      }
      #loadStatus.loader-columns::before {
        animation: columns 1560ms linear infinite;
      }
      #loadStatus.loader-helix::before {
        animation: helix 1280ms linear infinite;
      }
      #loadStatus.loader-diagswipe::before {
        animation: diagswipe 960ms linear infinite;
      }
      #loadStatus.loader-checkerboard::before {
        animation: checkerboard 1000ms linear infinite;
      }
      #loadStatus.is-error {
        color: #ff9a9a;
      }
      @keyframes scan {
        0% { content: "\2800\2800\2800\2800"; }
        10% { content: "\2847\2800\2800\2800"; }
        20% { content: "\28FF\2800\2800\2800"; }
        30% { content: "\28B8\2847\2800\2800"; }
        40% { content: "\2800\28FF\2800\2800"; }
        50% { content: "\2800\28B8\2847\2800"; }
        60% { content: "\2800\2800\28FF\2800"; }
        70% { content: "\2800\2800\28B8\2847"; }
        80% { content: "\2800\2800\2800\28FF"; }
        90% { content: "\2800\2800\2800\28B8"; }
      }
      @keyframes pulse {
        0% { content: "\2800\2836\2800"; }
        20% { content: "\2830\28FF\2806"; }
        40% { content: "\28BE\28C9\2877"; }
        60% { content: "\28CF\2800\28F9"; }
        80% { content: "\2841\2800\2888"; }
      }
      @keyframes cascade {

        92.86% { content: "\2800\2800\2800\2800"; }
      }

        0% { content: "\2881\2802\2814\2808"; }

      }

  </head>
  <body>
    <div id="ui">
      <button id="uiToggle" type="button" title="Hide controls">&lt;</button>
      <h3>Controls</h3>
      <div class="control">
        <label>Shadow Step</label>
        <input
          type="range"
          id="shadowStep"
          min="0"
          max="1"
          step="0.01"
          value="0"
        />
      </div>
      <div class="control">
        <label>Shadow Smooth</label>
        <input
          type="range"
          id="shadowSmooth"
          min="0"
          max="0.5"
          step="0.01"
          value="0.02"
        />
      </div>
      <div class="control">
        <label>Shadow Bias</label>
        <input
          type="range"
          id="shadowBias"
          min="-1"
          max="1"
          step="0.005"
          value="0"
        />
      </div>
      <div class="control">
        <label>Outline Width</label>
        <input
          type="range"
          id="outlineWidth"
          min="0"
          max="0.005"
          step="0.0001"
          value="0.001"
        />
      </div>
      <div class="control">
        <label>Outline Color</label>
        <input type="color" id="outlineColor" value="#2a1a0a" />
      </div>
      <div class="control">
        <label>Dither</label>
        <input
          type="range"
          id="ditherFade"
          min="0"
          max="1"
          step="0.01"
          value="1.0"
        />
      </div>
      <div class="control">
        <label>Mouth Tile</label>
        <input
          type="range"
          id="mouthTile"
          min="0"
          max="63"
          step="1"
          value="0"
        />
      </div>
      <div class="control">
        <label>Animation</label>
        <select id="animationSelect" disabled style="width: 100px">
          <option value="">None</option>
        </select>
      </div>
      <div id="timeline" hidden>
        <div class="timeline-row">
          <button id="timelinePlay" type="button" title="Play/Pause">❚❚</button>
          <div id="timelineTrack">
            <div class="track-bg"></div>
            <div class="track-fill"></div>
            <div class="track-thumb"></div>
          </div>
          <span id="timelineTime">0.00 / 0.00s</span>
        </div>
      </div>
      <div class="control">
        <label>Anim Speed</label>
        <input
          type="range"
          id="animationSpeed"
          min="0"
          max="2"
          step="0.05"
          value="1"
        />
      </div>
      <div class="control">
        <label><input type="checkbox" id="showAxes" checked /> XYZ</label>
      </div>
      <div class="control">
        <label><input type="checkbox" id="showGrid" checked /> Grid</label>
      </div>
      <div class="control">
        <label><input type="checkbox" id="showBodyParts" /> Body Points</label>
      </div>
      <div id="modelPartsPanel" class="part-panel" hidden>
        <div class="part-panel-header">
          <span>Model Parts</span>
          <button id="modelPartsReset" type="button">Reset</button>
        </div>
        <div id="modelPartsList"></div>
      </div>
      <div style="margin-top: 10px; text-align: center">
        <select
          id="charSelect"
          disabled
          style="
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            width: 100%;
          "
        >
          <option value="">-- Select Character --</option>
        </select>
        <button
          id="btnLoadChar"
          disabled
          style="
            padding: 6px 16px;
            background: #7ec8e3;
            border: none;
            border-radius: 4px;
            font-weight: bold;
          "
        >
          Load Character
        </button>
      </div>
    </div>
    <div id="loadStatus" role="status" aria-live="polite"></div>

    <script>
      const ui = document.getElementById("ui");
      const uiToggle = document.getElementById("uiToggle");
      uiToggle.addEventListener("click", () => {
        const collapsed = ui.classList.toggle("ui-collapsed");
        uiToggle.textContent = collapsed ? ">" : "<";
        uiToggle.title = collapsed ? "Show controls" : "Hide controls";
      });
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
